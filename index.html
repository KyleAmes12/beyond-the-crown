function battleBackdrop(t){let c=t==="blackmere"?'#17304a':t==="dreadhaven"?'#40151a':'#243128';return `<svg viewBox="0 0 720 300" preserveAspectRatio="xMidYMid slice"><rect width="720" height="300" fill="#090a0d"/><path d="M0 210Q150 164 310 206T720 198V300H0Z" fill="${c}" opacity=".52"/><path d="M0 230Q170 196 340 228T720 222V300H0Z" fill="#08090c"/><g opacity=".28" stroke="#8f8778" stroke-width="5"><path d="M110 210V99M104 100H138M560 210V80M553 82H590"/><path d="M250 210V132M430 210V124"/></g><circle cx="603" cy="58" r="34" fill="#d4cbb2" opacity=".12"/></svg>`}
function npcPortrait(id){let n=npcs[id],themes={mara:['#5d3b35','#c18b6e'],aldren:['#4a4a4e','#b8a68c'],vael:['#463653','#c0adc9'],voss:['#3f4d57','#c49d72'],elira:['#4d2f3f','#d3aa8b'],rook:['#252833','#8c91a8'],serka:['#493638','#b99482'],orrin:['#3b4741','#b6b0a1'],pilgrim:['#252126','#9c8b84']},q=themes[id]||['#3a3a40','#aaa'];return `<svg viewBox="0 0 92 112"><rect width="92" height="112" fill="#0a0b0f"/><circle cx="46" cy="44" r="24" fill="${q[1]}"/><path d="M19 111Q20 74 46 72Q75 74 75 111Z" fill="${q[0]}"/><path d="M22 45Q22 10 47 9Q76 11 73 48L61 37H32Z" fill="${q[0]}"/><circle cx="38" cy="45" r="2" fill="#1a1717"/><circle cx="54" cy="45" r="2" fill="#1a1717"/><path d="M39 57Q46 61 53 57" fill="none" stroke="#6e5149" stroke-width="1.5"/><text x="46" y="103" text-anchor="middle" fill="#d3aa59" font-size="9" font-family="system-ui">${esc(n.name.split(' ')[0]).toUpperCase()}</text></svg>`}
function itemIcon(i){let n=(i?.name||'').toLowerCase(),sym=n.includes('sword')||n.includes('blade')||n.includes('knife')||n.includes('axe')||n.includes('fang')?'⚔️':n.includes('ring')?'💍':n.includes('charm')||n.includes('relic')||n.includes('sigil')?'🔮':n.includes('potion')||i?.type==='supply'?'🧪':n.includes('armor')||n.includes('mail')||n.includes('plate')?'🛡️':n.includes('bow')?'🏹':n.includes('coin')||n.includes('ledger')?'🪙':n.includes('thread')?'🧵':'✦';return `<div class="itemIcon">${sym}</div>`}
function mapArt(){let known=id=>p.discovered.includes(id),here=id=>p.town===id;return `<div class="mapVisual"><svg viewBox="0 0 720 270"><defs><radialGradient id="mapfog"><stop stop-color="#56616a" stop-opacity=".22"/><stop offset="1" stop-color="#0b0d10" stop-opacity="0"/></radialGradient></defs><rect width="720" height="270" fill="#0b0e12"/><path d="M38 214Q139 165 219 191T384 157T672 93" fill="none" stroke="#675a46" stroke-width="7" stroke-dasharray="10 9"/><path d="M200 195Q280 120 366 153" fill="none" stroke="#675a46" stroke-width="5" stroke-dasharray="8 8"/><g fill="none" stroke="#2f3942" stroke-width="2" opacity=".7"><path d="M0 70Q130 105 230 60T470 77T720 42"/><path d="M0 244Q140 208 280 239T580 213T720 230"/></g><circle cx="130" cy="199" r="95" fill="url(#mapfog)"/><circle cx="365" cy="150" r="95" fill="url(#mapfog)"/><circle cx="604" cy="91" r="95" fill="url(#mapfog)"/>${mapNodeSvg('grimhollow',130,199,'GRIMHOLLOW',known('grimhollow'),here('grimhollow'))}${mapNodeSvg('blackmere',365,150,'BLACKMERE',known('blackmere'),here('blackmere'))}${mapNodeSvg('dreadhaven',604,91,'DREADHAVEN',known('dreadhaven'),here('dreadhaven'))}</svg></div>`}
function mapNodeSvg(id,x,y,label,known,here){return `<g class="mapNode ${known?'':'lockedNode'} ${here?'mapPulse':''}" onclick="${known&&!here?`travelTo('${id}')`:''}"><circle cx="${x}" cy="${y}" r="20" fill="${here?'#d3aa59':known?'#7f6c4c':'#333841'}" stroke="#e2d2ad" stroke-width="2"/><path d="M${x-7} ${y+7}V${y-4}L${x} ${y-12}L${x+7} ${y-4}V${y+7}Z" fill="#101217"/><text x="${x}" y="${y+38}" text-anchor="middle" fill="${known?'#eee2cf':'#777'}" font-size="12" font-family="system-ui" font-weight="700">${known?label:'???'}</text></g>`}
function dungeonInfo(){return {grimhollow:{name:'The Old Ossuary',desc:'A collapsed burial complex beneath the chapel hill.',tone:'#304037'},blackmere:{name:'The Sunken Crypts',desc:'Flooded vaults beneath Blackmere’s cathedral foundations.',tone:'#17364a'},dreadhaven:{name:'The Hollow Keep',desc:'A sealed military crypt inside Dreadhaven’s oldest wall.',tone:'#4a1b22'}}[p.town]}
function dungeonArt(){let d=dungeonInfo();return `<div class="dungeonScene"><svg viewBox="0 0 720 240"><rect width="720" height="240" fill="#090a0d"/><path d="M0 217V82Q95 38 180 82Q260 28 350 82Q445 35 530 82Q630 36 720 82V240H0Z" fill="${d.tone}" opacity=".52"/><g stroke="#6c645c" stroke-width="9" opacity=".34"><path d="M96 220V86M265 220V78M454 220V81M628 220V87"/><path d="M60 91H135M229 83H302M418 86H491M591 92H665"/></g><g class="dungeonTorch" fill="#f2a746"><circle cx="154" cy="124" r="8"/><circle cx="566" cy="121" r="8"/></g><g class="dungeonFog" fill="#bec4c3" opacity=".1"><ellipse cx="220" cy="205" rx="230" ry="25"/><ellipse cx="590" cy="210" rx="190" ry="23"/></g></svg><div class="sceneText"><b class="gold">${d.name}</b><br><small>${d.desc}</small></div></div>`}
function specialVisual(id){let layer=document.createElement('div');layer.className='specialBurst';for(let i=0;i<11;i++){let e=document.createElement('i');e.style.left=(18+Math.random()*64)+'%';e.style.top=(22+Math.random()*50)+'%';e.style.setProperty('--r',(Math.random()*120-60)+'deg');layer.appendChild(e)}document.body.appendChild(layer);setTimeout(()=>layer.remove(),700)}
function phaseTransform(){sfx('phase');let z=document.createElement('div');z.className='phaseFlash';document.body.appendChild(z);setTimeout(()=>z.remove(),950);sfx('bossRoar');flashFx('boss','PHASE II')}
function treasureVisual(text){return `<div class="treasureStage"><div class="lootBurst">${esc(text||'Rare Loot')}</div><div class="chest"></div></div>`}
function flashFx(kind="hit",text=""){let layer=document.createElement("div");layer.className="fxLayer";if(kind==="slash"||kind==="crit"){let sl=document.createElement("div");sl.className="slashFx";layer.appendChild(sl)}if(text){let d=document.createElement("div");d.className=`damageFloat ${kind==="crit"?"crit":kind==="heal"?"heal":""}`;d.textContent=text;layer.appendChild(d)}document.body.appendChild(layer);document.body.classList.add(kind==="crit"?"screenCrit":kind==="victory"?"victoryGlow":"screenFlash");if(kind==="hit"||kind==="crit"||kind==="boss")document.body.classList.add("screenShake");setTimeout(()=>{layer.remove();document.body.classList.remove("screenCrit","screenFlash","screenShake","victoryGlow")},760)}
function save(){localStorage.setItem("btc-save",JSON.stringify(p))}function stats(){let s={...p};for(const id of p.equipped){let i=findGear(id);if(i?.apply)i.apply(s)}return s}function grantedMoves(){let seen=new Set(),out=[];for(const id of p.equipped){let i=findGear(id);if(i?.specialMove&&specialMoves[i.specialMove]&&!seen.has(i.specialMove)){seen.add(i.specialMove);out.push(i.specialMove)}}return out}function xpNeed(){return p.level*100}function header(){let s=stats(),hp=Math.max(0,p.hp/p.maxHp*100),xp=Math.min(100,p.xp/xpNeed()*100);return `<div class="card"><div class="location">📍 ${towns[p.town]?.name||"The Road"}</div><div class="stats"><b>LV ${p.level}</b><span>XP ${p.xp}/${xpNeed()}</span><span>⚔️ ${s.attack} ATK</span><span>🛡️ ${s.defense} DEF</span><span>💥 ${Math.round(s.crit*100)}% CRIT</span><span>💨 ${Math.round(s.dodge*100)}% DODGE</span><span>🍀 ${Math.round(s.lootChance*100)}% LOOT CHANCE</span><span>📦 ${Math.round(s.lootGain*100)}% LOOT GAIN</span><span>🪙 ${p.gold} Gold</span><span>🧪 ${p.potions} Potions</span></div><p>❤️ ${p.hp}/${p.maxHp}</p><div class="bar"><div class="fill" style="width:${hp}%"></div></div><div class="bar" style="margin-top:5px;height:5px"><div class="xpfill" style="width:${xp}%"></div></div><button id="musicToggle" class="musicctl" onclick="toggleMusic()">${musicState.on?"🔊 Sound: On":"🎵 Start Sound"}</button></div>`}
function home(){setSceneMusic("town");enemy=null;log=[];let t=towns[p.town];document.getElementById("app").innerHTML=header()+sceneVisual()+`<div class="card"><h2>${t.name}</h2><p class="muted">${t.type}</p><p>${t.desc}</p><button onclick="townView()">🏘️ Explore ${t.name}</button><button class="travel" onclick="worldMap()">🗺️ World Map & Travel</button><button class="quest" onclick="journal()">📜 Quest Journal ${activeCount()?`(${activeCount()})`:""}</button><button onclick="wilderness()">⚔️ Venture Beyond the Walls</button><button class="quest" onclick="dungeon()">🕯️ Explore Nearby Dungeon</button><button onclick="gear()">🎒 Abilities & Inventory</button><button onclick="save();alert('Game saved on this device.')">💾 Save</button></div>`}
function townView(){setSceneMusic("town");let t=towns[p.town];document.getElementById("app").innerHTML=header()+sceneVisual()+`<div class="card"><h2>🏘️ ${t.name}</h2><h3>Places</h3>${t.places.map(x=>`<div class="tag">${x}</div>`).join("")}<hr class="divider"><h3>People</h3>${t.npcs.map(id=>{let n=npcs[id],q=n.quest&&questStatus(n.quest);return `<button onclick="talk('${id}')">💬 ${n.name} — ${n.role}${q==="ready"?" ✓":""}</button>`}).join("")}<hr class="divider"><h3>Shops</h3><p class="muted">Every merchant carries at least 40 different items.</p>${t.shops.map(id=>{let sh=shops[id];return `<button class="shop" onclick="shop('${id}',0)">${sh.icon} ${sh.name} — 40 Items</button>`}).join("")}<button onclick="rest()">🔥 Rest at the Inn (20 Gold)</button><button onclick="home()">Back</button></div>`}
function talk(id){let n=npcs[id],extra="";if(n.quest){let q=quests[n.quest],st=questStatus(n.quest);if(st==="new")extra=`<div class="card sub quest"><b>${q.type}: ${q.name}</b><p>${q.desc}</p><p class="gold">Reward: ${q.rewardGold} Gold • ${q.rewardXp} XP</p><button onclick="acceptQuest('${n.quest}','${id}')">Accept Quest</button></div>`;if(st==="active"){let c=progress(n.quest);extra=`<div class="card sub"><b>${q.name}</b><p>Progress: ${c}/${q.need} ${q.target}</p></div>`}if(st==="ready")extra=`<div class="card sub quest"><b>Quest Complete: ${q.name}</b><p>You have done what was asked.</p><button onclick="turnIn('${n.quest}','${id}')">Claim Reward</button></div>`;if(st==="done")extra=`<p class="good">✓ You have already helped ${n.name}.</p>`}document.getElementById("app").innerHTML=header()+`<div class="card"><div class="portraitWrap"><div class="npcPortrait">${npcPortrait(id)}</div><div><h2>${n.name}</h2><p class="muted">${n.role}</p><div class="dialogueBox">“${n.text.replace(/^.*?‘|’$/g,"")}"</div></div></div>${extra}<button onclick="townView()">Leave</button></div>`}
function acceptQuest(qid,id){p.quests[qid]={state:"active",startKills:p.kills[quests[qid].target]||0};save();talk(id)}function progress(qid){let x=p.quests[qid];if(!x)return 0;return Math.max(0,(p.kills[quests[qid].target]||0)-(x.startKills||0))}function questStatus(qid){let x=p.quests[qid];if(!x)return"new";if(x.state==="done")return"done";return progress(qid)>=quests[qid].need?"ready":"active"}function activeCount(){return Object.keys(p.quests).filter(q=>p.quests[q].state!=="done").length}
function turnIn(qid,id){let q=quests[qid];if(questStatus(qid)!=="ready")return;p.gold+=q.rewardGold;p.xp+=q.rewardXp;p.quests[qid].state="done";let msg=`Quest complete! +${q.rewardGold} Gold, +${q.rewardXp} XP.`;if(q.unlock&&!p.discovered.includes(q.unlock)){p.discovered.push(q.unlock);msg+=`\nNew destination discovered: ${towns[q.unlock].name}!`}levelCheck();save();alert(msg);talk(id)}
function journal(){let ids=Object.keys(p.quests);document.getElementById("app").innerHTML=header()+`<div class="card"><h2>📜 Quest Journal</h2>${ids.length?ids.map(id=>{let q=quests[id],st=questStatus(id),c=Math.min(progress(id),q.need);return `<div class="card sub"><b class="gold">${q.name}</b> <span class="tag">${q.type}</span><p>${q.desc}</p><p>${st==="done"?"✓ Completed":`${c}/${q.need} ${q.target}${st==="ready"?" — Return to quest giver!":""}`}</p></div>`}).join(""):"<p>No quests yet. Talk to people around town.</p>"}<button onclick="home()">Back</button></div>`}
function worldMap(){setSceneMusic("road");document.getElementById("app").innerHTML=header()+`<div class="card"><h2>🗺️ The Shrouded Kingdom</h2><p class="muted">Tap a discovered settlement on the map to travel there.</p>${mapArt()}${Object.keys(towns).map(id=>{let t=towns[id],known=p.discovered.includes(id),here=id===p.town;return `<div class="card sub"><b>${known?t.name:"???"}</b><p>${known?t.type+" — "+t.desc:"This place has not yet been revealed."}</p>${known&&!here?`<button class="travel" onclick="travelTo('${id}')">Travel to ${t.name}</button>`:here?"<p class='good'>📍 You are here.</p>":""}</div>`}).join("")}<button onclick="home()">Back</button></div>`}
function travelTo(id){setSceneMusic("road");sfx("travel");if(!p.discovered.includes(id))return;let from=p.town;p.town=id;save();let r=Math.random();if(r<.22){returnTown=id;let pool=towns[id].encounters;let e=enemies[pool[Math.floor(Math.random()*pool.length)]];enemy=structuredClone(e);enemy.maxHp=enemy.hp;log=[`On the road from ${towns[from].name}, something steps from the fog...`,`A ${enemy.name} attacks!`];return battle()}home()}
function dungeon(){setSceneMusic("road");let d=dungeonInfo();document.getElementById("app").innerHTML=header()+dungeonArt()+`<div class="card"><h2>🕯️ ${d.name}</h2><p>${d.desc}</p><button onclick="dungeonFight()">⚔️ Press Deeper</button><button class="shop" onclick="searchDungeon()">🗝️ Search for Treasure</button><button onclick="home()">Return to Town</button></div>`}
function dungeonFight(){let pool=towns[p.town].encounters;let key=pool[Math.floor(Math.random()*pool.length)];start(enemies[key])}
function searchDungeon(){sfx("loot");let key="dungeonLoot_"+p.town+"_"+(new Date().toDateString());if(p.flags[key])return alert("You have already searched this dungeon thoroughly today.");p.flags[key]=true;let gold=35+Math.floor(Math.random()*76),found=Math.random()<.42;p.gold+=gold;let lootText=`${gold} Gold`;if(found){let candidates=["Grave Rat Fang","Ashen Insignia","Mire Hound Hide","Veiled Sigil"],n=candidates[Math.floor(Math.random()*candidates.length)];p.loot[n]=(p.loot[n]||0)+1;lootText+=` + 1× ${n}`}save();document.getElementById("app").innerHTML=header()+`<div class="card"><h2>Treasure Found</h2>${treasureVisual(lootText)}<p class="gold">${lootText}</p><button onclick="dungeon()">Continue Exploring</button></div>`}
function wilderness(){setSceneMusic("road");let pool=towns[p.town].encounters;returnTown=p.town;start(enemies[pool[Math.floor(Math.random()*pool.length)]])}function start(e){enemy=structuredClone(e);enemy.maxHp=enemy.hp;log=[`A ${enemy.name} approaches.`];battle()}
function battle(){let boss=enemy?.name==="Crown Warden",phase=enemy?._phase||1;setSceneMusic(boss?"boss":"battle");let ep=Math.max(0,enemy.hp/enemy.maxHp*100),moves=grantedMoves();document.getElementById("app").innerHTML=header()+`<div class="card"><h2>${boss?"👑 BOSS — ":"⚔️ "}${enemy.name}</h2><div class="battleArena ${boss?"bossArena":""} ${phase>=2?"phase2":""}"><div class="battleBackdrop">${battleBackdrop(p.town)}</div>${boss?'<div class="bossAura"></div>':''}<div class="fighter playerFighter">${playerArt()}</div><div class="fighter enemyFighter">${enemyArt(enemy.name,phase)}</div>${boss?`<div class="phaseBadge">PHASE ${phase}</div>`:""}<div class="enemyNameplate">${boss?"CROWN WARDEN • BOSS":"HOSTILE • "+enemy.name}</div></div><div class="stats"><span>❤️ ${enemy.hp}/${enemy.maxHp}</span><span>⚔️ ${enemy.atk} ATK</span><span>🛡️ ${enemy.def} DEF</span><span>💨 ${Math.round(enemy.dodge*100)}% DODGE</span></div><div class="bar"><div class="fill" style="width:${ep}%"></div></div><div id="log">${log.slice(-7).map(x=>`<p>${x}</p>`).join("")}</div><button onclick="attack()">Attack</button>${moves.length?moves.map(id=>`<button class="quest" onclick="specialAttack('${id}')">✨ ${specialMoves[id].name}</button>`).join(""):"<p class='muted'>Equip certain weapons or relics to unlock special combat moves.</p>"}<button onclick="battleItems()">Use Item</button><button onclick="defend()">Defend</button><button onclick="run()">Run</button></div>`;if(boss&&!enemy._audioIntro){enemy._audioIntro=true;enemy._phase=1;sfx("bossRoar");flashFx("boss","BOSS")}}
function checkBossPhase(){if(enemy?.name!=="Crown Warden"||enemy.hp<=0)return false;if(!enemy._phase)enemy._phase=1;if(enemy._phase===1&&enemy.hp<=enemy.maxHp*.5){enemy._phase=2;enemy.atk+=5;enemy.def+=2;enemy.crit=Math.min(.24,enemy.crit+.07);enemy.dodge=Math.min(.18,enemy.dodge+.05);enemy.moves.push(["Crownfire Cleave",9,1.75],["Broken Oath",6,2.05]);log.push("🔥 The Crown Warden tears away its shattered mantle. PHASE II begins!");phaseTransform();setTimeout(battle,520);return true}return false}
function damage(atk,def,m=1){return Math.max(1,Math.round(atk*m-def*.55+Math.random()*4))}function attack(mult=1,name="Attack"){sfx("attack");let s=stats();if(Math.random()<enemy.dodge){sfx("dodge");log.push(`${enemy.name} dodged your ${name}.`);return enemyTurn()}let d=damage(s.attack,enemy.def,mult),crit=Math.random()<s.crit;if(crit){d=Math.round(d*s.critDmg);sfx("crit")}else sfx("hit");enemy.hp=Math.max(0,enemy.hp-d);flashFx(crit?"crit":"slash",`-${d}`);log.push(`${crit?"💥 CRITICAL! ":""}You use ${name} for ${d} damage.`);if(crit&&p.equipped.includes("blood")){let h=Math.max(1,Math.round(d*.2));p.hp=Math.min(p.maxHp,p.hp+h);sfx("heal");log.push(`Bloodglass restores ${h} HP.`)}if(enemy.hp<=0)return win();if(checkBossPhase())return;enemyTurn()}function specialAttack(id){sfx("special");specialVisual(id);let m=specialMoves[id];if(!m||!grantedMoves().includes(id))return battle();let s=stats();if(Math.random()>m.accuracy||Math.random()<enemy.dodge){sfx("dodge");log.push(`${enemy.name} evades your ${m.name}.`);return enemyTurn()}let effectiveDef=enemy.def*(1-(m.pierce||0)),d=damage(s.attack,effectiveDef,m.mult),crit=Math.random()<Math.min(.95,s.crit+(m.critBonus||0));if(crit){d=Math.round(d*s.critDmg);sfx("crit")}else sfx("hit");enemy.hp=Math.max(0,enemy.hp-d);flashFx(crit?"crit":"slash",`-${d}`);log.push(`${crit?"💥 CRITICAL! ":""}You use ${m.name} for ${d} damage.`);if(m.healPct){let h=Math.max(1,Math.round(d*m.healPct));p.hp=Math.min(p.maxHp,p.hp+h);log.push(`${m.name} restores ${h} HP.`)}if(crit&&p.equipped.includes("blood")){let h=Math.max(1,Math.round(d*.2));p.hp=Math.min(p.maxHp,p.hp+h);sfx("heal");log.push(`Bloodglass restores ${h} HP.`)}if(enemy.hp<=0)return win();if(checkBossPhase())return;enemyTurn()}function chooseMove(){let r=Math.random()*100,a=0;for(const m of enemy.moves){a+=m[1];if(r<=a)return m}return enemy.moves[0]}function enemyTurn(defending=false){let s=stats(),m=chooseMove();if(Math.random()<s.dodge){sfx("dodge");log.push(`💨 You dodge ${enemy.name}'s ${m[0]}!`);return battle()}let d=damage(enemy.atk,s.defense,m[2]);if(defending)d=Math.ceil(d*.5);let c=Math.random()<enemy.crit;if(c)d=Math.round(d*enemy.critD);p.hp=Math.max(0,p.hp-d);sfx(enemy.name==="Crown Warden"?"bossAttack":"enemyAttack");sfx(c?"crit":"impact");flashFx(c?"crit":"hit",`-${d} HP`);log.push(`${enemy.name} uses ${m[0]}. ${c?"💥 CRITICAL! ":""}You take ${d} damage.`);save();if(p.hp<=0)return lose();battle()}function defend(){sfx("defend");log.push("You brace for the next attack.");enemyTurn(true)}function potion(){sfx("item");if(!p.potions){log.push("You have no potions.");return battle()}p.potions--;let h=Math.min(40,p.maxHp-p.hp);p.hp+=h;sfx("heal");flashFx("heal",`+${h} HP`);log.push(`You restore ${h} HP.`);enemyTurn()}function run(){sfx("run");if(Math.random()<.65){save();home()}else{log.push("You fail to escape.");enemyTurn()}}
function win(){sfx("victory");flashFx("victory","VICTORY");let s=stats(),g=Math.floor(enemy.gold[0]+Math.random()*(enemy.gold[1]-enemy.gold[0]+1));if(p.equipped.includes("coin"))g=Math.round(g*1.35);p.gold+=g;p.xp+=enemy.xp;p.kills[enemy.name]=(p.kills[enemy.name]||0)+1;log.push(`🏆 Victory! +${g} Gold, +${enemy.xp} XP.`);let lootNames={"Grave Rat":"Grave Rat Fang","Ash Bandit":"Ashen Insignia","Mire Hound":"Mire Hound Hide","Veiled Cultist":"Veiled Sigil","Crown Warden":"Warden Crest"},lootReveal="";if(Math.random()<Math.min(.95,s.lootChance)){let name=lootNames[enemy.name]||`${enemy.name} Trophy`,qty=Math.max(1,Math.round(s.lootGain));p.loot[name]=(p.loot[name]||0)+qty;sfx("loot");log.push(`🎁 Loot found: ${qty}× ${name}.`);lootReveal=treasureVisual(`${qty}× ${name}`)}else log.push(`No loot dropped. (${Math.round(s.lootChance*100)}% chance)`);levelCheck();save();let ready=Object.keys(p.quests).filter(q=>questStatus(q)==="ready");document.getElementById("app").innerHTML=header()+`<div class="card">${lootReveal}${log.slice(-6).map(x=>`<p>${x}</p>`).join("")}${ready.length?`<p class="gold">📜 Quest objective complete: ${ready.map(q=>quests[q].name).join(", ")}</p>`:""}<button onclick="home()">Continue</button></div>`}function levelCheck(){let leveled=false;while(p.xp>=p.level*100){p.xp-=p.level*100;p.level++;p.maxHp+=15;p.attack+=3;p.defense+=1;p.capacity++;p.hp=p.maxHp;leveled=true}if(leveled)sfx("level")}function lose(){sfx("death");setSceneMusic("town");p.hp=p.maxHp;p.gold=Math.max(0,p.gold-20);save();document.getElementById("app").innerHTML=`<div class="card"><h2>YOU FALL.</h2><p>Something drags you back from the dark.</p><p>You lose 20 Gold and awaken in ${towns[p.town].name}.</p><button onclick="home()">Wake Up</button></div>`}
function shop(shopId,page=0){setSceneMusic("town");let sh=shops[shopId];if(!sh||sh.town!==p.town)return townView();let list=shopCatalogs[shopId],per=10,pages=Math.ceil(list.length/per);page=Math.max(0,Math.min(page,pages-1));let shown=list.slice(page*per,page*per+per);document.getElementById("app").innerHTML=header()+`<div class="card"><h2>${sh.icon} ${sh.name}</h2><p>${sh.desc}</p><p class="muted">40 items in stock • Page ${page+1}/${pages}</p>${shown.map(i=>{let owned=i.type==="gear"&&p.inventory.includes(i.id),count=i.type==="supply"?(p.supplies[i.id]||0):0;return `<div class="card sub"><div class="itemRow">${itemIcon(i)}<div><b class="gold">${i.name}</b> <span class="tag">${i.type==="gear"?"Equipment":"Consumable"}</span><p>${i.desc}</p><small>${i.type==="gear"?`${i.cost} Capacity • `:""}${i.price} Gold${count?` • Owned: ${count}`:""}</small>${owned?"<p class='good'>✓ Owned</p>":`<button onclick="buyShopItem('${shopId}','${i.id}',${page})">Buy</button>`}</div></div></div>`}).join("")}<div class="row"><button ${page<=0?"disabled":""} onclick="shop('${shopId}',${page-1})">← Previous</button><button ${page>=pages-1?"disabled":""} onclick="shop('${shopId}',${page+1})">Next →</button></div><button onclick="townView()">Back to ${towns[p.town].name}</button></div>`}
function buyShopItem(shopId,id,page){let i=shopCatalogs[shopId]?.find(x=>x.id===id);if(!i)return;if(p.gold<i.price)return alert("Not enough gold.");if(i.type==="gear"&&p.inventory.includes(id))return alert("You already own this item.");p.gold-=i.price;sfx("coin");if(i.type==="gear")p.inventory.push(id);else p.supplies[id]=(p.supplies[id]||0)+1;save();shop(shopId,page)}
function battleItems(){let supplies=Object.keys(p.supplies).filter(id=>p.supplies[id]>0).map(id=>findSupply(id)).filter(Boolean);document.getElementById("app").innerHTML=header()+`<div class="card"><h2>🧪 Battle Items</h2><div class="card sub"><b>Healing Potion</b><p>Restores 40 HP.</p><small>Owned: ${p.potions}</small><button ${p.potions?"":"disabled"} onclick="potion()">Use Potion</button></div>${supplies.length?supplies.map(i=>`<div class="card sub"><b>${i.name}</b><p>${i.desc}</p><small>Owned: ${p.supplies[i.id]||0}</small><button onclick="useSupply('${i.id}')">Use</button></div>`).join(""):"<p class='muted'>You have no other consumables.</p>"}<button onclick="battle()">Back to Battle</button></div>`}
function useSupply(id){sfx("item");let i=findSupply(id);if(!i||!(p.supplies[id]>0))return battleItems();p.supplies[id]--;let h=Math.min(i.heal,p.maxHp-p.hp);p.hp+=h;sfx("heal");flashFx("heal",`+${h} HP`);log.push(`You use ${i.name} and restore ${h} HP.`);save();enemyTurn()}
function gear(){setSceneMusic("town");let used=p.equipped.reduce((n,id)=>n+(findGear(id)?.cost||0),0);let owned=p.inventory.map(id=>findGear(id)).filter(Boolean);let supplies=Object.keys(p.supplies).filter(id=>p.supplies[id]>0).map(id=>({item:findSupply(id),count:p.supplies[id]})).filter(x=>x.item),loot=Object.entries(p.loot).filter(x=>x[1]>0);document.getElementById("app").innerHTML=header()+`<div class="card"><h2>🎒 Equipment & Inventory</h2><p>Ability Capacity: ${used}/${p.capacity}</p><h3>Equipment</h3>${owned.length?owned.map(i=>{let on=p.equipped.includes(i.id);return `<div class="card sub"><div class="itemRow">${itemIcon(i)}<div><b>${i.name}</b><p>${i.desc}</p>${i.specialMove?`<p class="good">✨ Grants ${specialMoves[i.specialMove].name}: ${specialMoves[i.specialMove].desc}</p>`:""}<button onclick="toggle('${i.id}')">${on?"Unequip":"Equip"} (${i.cost})</button></div></div></div>`}).join(""):"<p>You don't own any equipment yet.</p>"}<h3>Consumables</h3><div class="card sub"><b>Healing Potion</b><p>Owned: ${p.potions}</p></div>${supplies.length?supplies.map(x=>`<div class="card sub"><b>${x.item.name}</b><p>${x.item.desc}</p><small>Owned: ${x.count}</small></div>`).join(""):"<p class='muted'>No special supplies.</p>"}<h3>Monster Loot</h3>${loot.length?loot.map(([name,count])=>`<div class="card sub"><b>${name}</b><p>Owned: ${count}</p></div>`).join(""):"<p class='muted'>No monster loot collected yet.</p>"}<button onclick="home()">Back</button></div>`}
function toggle(id){sfx("equip");let i=findGear(id);if(!i)return;let used=p.equipped.reduce((n,z)=>n+(findGear(z)?.cost||0),0);if(p.equipped.includes(id))p.equipped=p.equipped.filter(x=>x!==id);else{if(used+i.cost>p.capacity)return alert("Not enough Ability Capacity.");p.equipped.push(id)}save();gear()}
function rest(){sfx("heal");if(p.gold<20)return alert("Not enough gold.");p.gold-=20;p.hp=p.maxHp;save();home()}save();home();
</script></body></html>
